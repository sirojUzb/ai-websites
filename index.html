<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greenshop</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <header class="bg-white shadow-md">
        <div class="container mx-auto flex items-center justify-between py-4 px-6">
            <!-- Logo -->
            <div class="flex items-center">
                <img src="images/logo-green.svg" alt="Greenshop Logo" class="h-10">
            </div>

            <!-- Navigation -->
            <nav class="flex space-x-6">
                <a href="#" class="text-gray-700 hover:text-green-600">Home</a>
                <a href="#" class="text-gray-700 hover:text-green-600">Shop</a>
                <a href="#" class="text-gray-700 hover:text-green-600">Plant care</a>
                <a href="#" class="text-gray-700 hover:text-green-600">Blogs</a>
            </nav>

            <!-- Icons and Login -->
            <div class="flex items-center space-x-4">
                <button class="text-gray-700 hover:text-green-600">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m0 0a7.5 7.5 0 10-10.6 0 7.5 7.5 0 0010.6 0z" />
                    </svg>
                </button>
                <button class="relative">
                    <img src="images/cart.png" alt="Cart" class="w-6 h-6">
                </button>
                <img src="images/Login.svg" alt="Login" class="h-8">
            </div>
        </div>
    </header>
</body>
</html>
